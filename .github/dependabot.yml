version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Ohne Gruppe kommt pro Action ein eigener PR (frueher #1, #2, #6 fuer
    # zwei Actions). Die Workflows nutzen nur wenige Actions, die zusammen
    # in einem PR schneller durchzusehen sind.
    groups:
      github-actions:
        patterns: ["*"]
