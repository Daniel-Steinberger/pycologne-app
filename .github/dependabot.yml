# Patch- und Minor-Updates kommen getrennt von den Major-Updates, damit der
# Auto-Merge-Workflow die harmlosen Gruppen durchwinken kann, waehrend Majors
# als eigener PR liegen bleiben. Ohne die Trennung wuerde ein einzelnes
# Major-Update die uebrigen Updates im selben PR mit blockieren.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Nur uv.lock aktualisieren, die Untergrenzen in pyproject.toml in Ruhe
    # lassen. Auf dem Server werden die Abhaengigkeiten nicht aus uv.lock,
    # sondern aus nixpkgs aufgeloest -- dort liegt z.B. markdown-it-py 3.0.0.
    # Eine angehobene Untergrenze (PR #9 wollte ">=3" zu ">=4.2.0" machen)
    # laesst die CI gruen und macht die Anforderung auf dem Server zugleich
    # unerfuellbar. Die Constraints bleiben deshalb bewusst weit.
    versioning-strategy: lockfile-only
    groups:
      python-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-deps-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Ohne Gruppe kommt pro Action ein eigener PR (frueher #1, #2, #6 fuer
    # zwei Actions). Die Workflows nutzen nur wenige Actions, die zusammen
    # in einem PR schneller durchzusehen sind.
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      github-actions-major:
        patterns: ["*"]
        update-types: ["major"]
