[project]
name = "pycologne-app"
version = "1.0"
description = "PyCologne Flask Webseite"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "PyCologne", email = "webteam@pycologne.de" }]
maintainers = [
    { name = "Daniel Steinberger", email = "daniel.steinberger@dvs.ag" },
]
dependencies = [
    "flask>=3.0",
    # linkify-Extra: ohne linkify-it-py ignoriert markdown-it-py die
    # linkify-Option stillschweigend, Adressen im Text blieben dann Text.
    #
    # Die Untergrenze richtet sich nach dem Server, nicht nach dem, was
    # uv.lock installiert: dort kommen die Pakete aus nixpkgs. Seit dem
    # Platform-Upgrade am 16.09.2026 laeuft der Server auf nixos-26.05 und
    # damit auf markdown-it-py 4.0.0, deshalb steht die Grenze jetzt bei 4.
    # Nicht hoeher: ">=4.2.0" waere in der CI gruen und beim Deployment
    # zugleich unerfuellbar, denn 4.2.0 steht bis 26.11 nur in unstable.
    "markdown-it-py[linkify]>=4",
    "python-dateutil>=2.9",
    "babel>=2.16",
    "pygments>=2.20.0",
]

[project.urls]
Repository = "https://github.com/Daniel-Steinberger/pycologne-app"
Homepage = "https://www.pycologne.de"

[project.scripts]
pycologne-webapp = "pycgnweb.webapp:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pylint>=3.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-playwright>=0.5",
    "pre-commit>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pycgnweb"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["templates", "static", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "E501",  # line length is handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"_tests/**" = ["S101"]  # asserts are fine in tests

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["dateutil.*", "pygments.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["_tests"]
markers = [
    "e2e: end-to-end tests using a real browser (deselect with '-m \"not e2e\"')",
]
addopts = "-m 'not e2e'"
